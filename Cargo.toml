[workspace]
members = [
    "crates/brb-core",
    "crates/brb-simulator",
    "crates/brb-network",
    "crates/brb-experiments",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Bracha-RBC Project"]
license = "MIT"

[workspace.dependencies]
serde       = { version = "1", features = ["derive"] }
bincode     = "2"
tokio       = { version = "1", features = ["full"] }
thiserror   = "2"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand        = "0.8"
proptest    = "1"
serde_json  = "1"
clap        = { version = "4", features = ["derive"] }
criterion   = { version = "0.5", features = ["html_reports"] }
